name: Manual Release

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      build_app:
        description: '构建app模块'
        required: true
        default: true
        type: boolean
      build_aqq:
        description: '构建aqq模块'
        required: true
        default: true
        type: boolean
      tag_name:
        description: 'Release标签（如v1.0.0，留空则自动生成）'
        required: false
        type: string
      release_title:
        description: 'Release标题（留空则自动生成）'
        required: false
        type: string
      release_body:
        description: 'Release内容（留空则自动生成）'
        required: false
        type: string

  # 基于标签推送触发
  push:
    tags:
      - 'v*'

jobs:
  build-app:
    name: Build App Module (Release)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_app == 'true' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Decode Keystore
      run: echo "${{ secrets.SIGN_KEY_B64 }}" | base64 --decode > app/sign_key
    
    - name: Build Release APK (app)
      run: |
        ./gradlew :app:assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/app/sign_key \
          -Pandroid.injected.signing.store.password=${{ secrets.SIGN_KEY_PASSWD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.SIGN_KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.SIGN_KEY_PASSWD }}
    
    - name: Get app version
      id: get_version
      run: echo "version=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT
    
    - name: Rename APK to DBTool-v${{ steps.get_version.outputs.version }}-U-R.apk
      run: mv app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/DBTool-v${{ steps.get_version.outputs.version }}-U-R.apk
    
    - name: Upload app release APK
      uses: actions/upload-artifact@v4
      with:
        name: DBTool-v${{ steps.get_version.outputs.version }}-U-R.apk
        path: app/build/outputs/apk/release/DBTool-v${{ steps.get_version.outputs.version }}-U-R.apk
        retention-days: 3

  build-aqq:
    name: Build Aqq Module (Release)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_aqq == 'true' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Decode Keystore
      run: echo "${{ secrets.SIGN_KEY_B64 }}" | base64 --decode > aqq/sign_key
    
    - name: Build Release APK (aqq)
      run: |
        ./gradlew :aqq:assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/aqq/sign_key \
          -Pandroid.injected.signing.store.password=${{ secrets.SIGN_KEY_PASSWD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.SIGN_KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.SIGN_KEY_PASSWD }}
    
    - name: Get aqq version
      id: get_version
      run: echo "version=$(grep 'versionName' aqq/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT
    
    - name: Rename APK to DataBase-v${{ steps.get_version.outputs.version }}-U-R.apk
      run: mv aqq/build/outputs/apk/release/*.apk aqq/build/outputs/apk/release/DataBase-v${{ steps.get_version.outputs.version }}-U-R.apk
    
    - name: Upload aqq release APK
      uses: actions/upload-artifact@v4
      with:
        name: DataBase-v${{ steps.get_version.outputs.version }}-U-R.apk
        path: aqq/build/outputs/apk/release/DataBase-v${{ steps.get_version.outputs.version }}-U-R.apk
        retention-days: 3

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-app, build-aqq]
    if: always() && (needs.build-app.result == 'success' || needs.build-aqq.result == 'success')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Get app version
      id: get_app_version
      run: echo "version=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT
    
    - name: Get aqq version
      id: get_aqq_version
      run: echo "version=$(grep 'versionName' aqq/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT
    
    - name: Download app APK
      if: needs.build-app.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: DBTool-v${{ steps.get_app_version.outputs.version }}-U-R.apk
        path: ./artifacts
    
    - name: Download aqq APK
      if: needs.build-aqq.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: DataBase-v${{ steps.get_aqq_version.outputs.version }}-U-R.apk
        path: ./artifacts
    
    - name: Determine tag name
      id: tag_name
      run: |
        if [ -n "${{ github.event.inputs.tag_name }}" ]; then
          echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref_type }}" == "tag" ]; then
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          echo "tag=v${{ steps.get_app_version.outputs.version }}" >> $GITHUB_OUTPUT
        fi
    
    - name: Create tag if needed
      if: github.event_name == 'workflow_dispatch'
      run: |
        git tag ${{ steps.tag_name.outputs.tag }}
        git push origin ${{ steps.tag_name.outputs.tag }}
    
    - name: Determine release title
      id: release_title
      run: |
        if [ -n "${{ github.event.inputs.release_title }}" ]; then
          echo "title=${{ github.event.inputs.release_title }}" >> $GITHUB_OUTPUT
        else
          echo "title=${{ steps.tag_name.outputs.tag }}" >> $GITHUB_OUTPUT
        fi
    
    - name: Get git commit messages
      id: git_commits
      run: |
        # 获取自上次Release tag以来的提交记录
        # 如果是第一次Release，则获取所有提交
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          # 获取当前tag和前一个tag之间的提交
          COMMITS=$(git log --oneline --no-merges $PREV_TAG..HEAD)
        else
          # 如果没有之前的tag，获取所有提交
          COMMITS=$(git log --oneline --no-merges)
        fi
        # 格式化为Markdown列表
        FORMATTED=$(echo "$COMMITS" | sed 's/^/- /')
        echo "commits<<EOF" >> $GITHUB_OUTPUT
        echo "$FORMATTED" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Determine release body
      id: release_body
      run: |
        if [ -n "${{ github.event.inputs.release_body }}" ]; then
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "${{ github.event.inputs.release_body }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "## 更新内容" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "${{ steps.git_commits.outputs.commits }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## 下载应用" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          if [ -f "./artifacts/DBTool-v${{ steps.get_app_version.outputs.version }}-U-R.apk" ]; then
            echo "- DBTool-v${{ steps.get_app_version.outputs.version }}-U-R.apk" >> $GITHUB_OUTPUT
          fi
          if [ -f "./artifacts/DataBase-v${{ steps.get_aqq_version.outputs.version }}-U-R.apk" ]; then
            echo "- DataBase-v${{ steps.get_aqq_version.outputs.version }}-U-R.apk" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag_name.outputs.tag }}
        name: ${{ steps.release_title.outputs.title }}
        body: ${{ steps.release_body.outputs.body }}
        files: ./artifacts/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
